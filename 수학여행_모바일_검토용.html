else if(action==='user'){const u=demo.users.find(u=>u.id===data.id);Object.assign(u,{alias:data.alias,groupId:data.groupId,roleTitle:data.roleTitle})}
else if(action==='group'){const g=demo.groups.find(g=>g.id===data.id);if(g)Object.assign(g,{name:data.name,promise:data.promise});else demo.groups.push({id:ID(),classId:data.classId,name:data.name,promise:data.promise})}
else if(action==='teacher'){const u={id:ID(),role:'teacher',classId:data.classId,number:'',alias:data.alias,groupId:'',roleTitle:''};demo.users.push(u);codes.push({...u,code:'시연용-실제로그인불가'})}

function budget(r,p){const w=S.config.windows[p],sum=(r[p]||[]).reduce((a,v)=>a+v.travel+v.wait+v.play,0);return{sum,cap:mins(w[1])-mins(w[0]),over:sum+S.config.buffer>mins(w[1])-mins(w[0]),end:clock(mins(w[0])+sum+S.config.buffer)}}
function captureRoute(){if(route){route.reason=$('#reason')?.value??route.reason;route.alternative=$('#alternative')?.value??route.alternative}}
function routeView(){if(!route){const r=getRec(routeKey());route={am:[],pm:[],...cp(r.data)};routeRev=r.rev}const rows=route[period],map=S.config.maps[mapIdx]||S.config.maps[0],b=budget(route,period);return`${head('🗺️ 우리 모둠 롯데월드 동선','친구들의 의견을 모아 순서·시간·대체 계획을 정하고, 선생님께 확인받아요.',B('계획표 인쇄','print-route','white noprint'))}<div class="note warn mb"><strong>방문 순서 계획이지, 실시간 길안내가 아니에요.</strong> 대기·이동·체험 시간은 직접 입력한 예상값입니다. 운영 여부·이용 조건은 공식 안내와 현장에서 확인해요.</div><div class="grid2"><div class="stack"><div class="card"><div class="between wrap mb"><h3>롯데월드 안내지도</h3><a href="${E(S.config.officialMap)}" target="_blank" rel="noopener noreferrer" class="btn secondary tiny">공식 가이드맵 열기 ↗</a></div>${map?`<div class="row mb"><select id="map-select" aria-label="지도 선택">${S.config.maps.map((m,i)=>`<option value="${i}" ${map.id===m.id?'selected':''}>${E(m.name)}</option>`).join('')}</select><button class="iconbtn" data-act="zoom-out" aria-label="축소">−</button><button class="iconbtn" data-act="zoom-in" aria-label="확대">＋</button></div><div class="mapscroll"><div class="mapstage" id="mapstage" style="width:${zoom*100}%"><img src="${E(map.image)}" alt="${E(map.name)} · 교사가 확인한 지도">${rows.map((r,i)=>r.pin?.mapId===map.id?`<span class="pin" style="left:${r.pin.x*100}%;top:${r.pin.y*100}%">${i+1}</span>`:'').join('')}</div></div><p class="small muted mt8">${E(map.note)} · 번호는 방문 순서예요.</p><div class="note mt8 ${pinIndex===null?'hidden':''}" id="pinhint">${pinIndex===null?'':`${pinIndex+1}번 장소를 지도에서 눌러 주세요.`}</div>`:`<div class="mapblank"><div><span style="font-size:42px">🗺️</span><h3>확인된 지도를 기다리고 있어요.</h3><p class="small muted mt8">공식 가이드맵으로 위치를 확인해요. 총괄교사가 지도 이미지를 등록하면 확대하고 번호를 표시할 수 있어요.</p>${admin()?B('지도 등록하기','manage-map','secondary mt'):''}</div></div>`}<p class="small muted mt">예시 포스터의 그림 지도는 실제 지도로 사용하지 않았습니다. 임의의 위치나 최단 경로를 표시하지 않습니다.</p></div><div class="card meet"><h3>⏰ 식사와 집합은 먼저 지켜요.</h3><p class="small mt8">점심 12:30~13:30 · 저녁 17:00~18:00<br>계획서 기준 18:00 집결 및 서울스카이로 이동</p><p class="small mt8"><strong>교사 집합 안내:</strong> ${E(S.config.meeting.time)} · ${E(S.config.meeting.place||'장소 미등록')}</p></div></div><div class="stack"><div class="card"><div class="between mb"><h3>우리 모둠 방문 순서</h3>${P(status[getRec(routeKey()).data.status||'draft'],color[getRec(routeKey()).data.status||'draft'])}</div><div class="tabs">${['am','pm'].map(p=>`<button data-period="${p}" class="${period===p?'active':''}">${p==='am'?'오전':'오후'} ${S.config.windows[p].join('~')}</button>`).join('')}</div>${rows.map((r,i)=>`<div class="routeitem"><span class="num">${i+1}</span><div class="grow"><strong>${E(r.name)}</strong><p class="small muted">이동 ${r.travel}분 · 대기 ${r.wait}분 · 체험 ${r.play}분</p><p class="small muted">${E(r.note||'')}</p><div class="row mt8 noprint">${B('수정','edit-place','white tiny',`data-i="${i}"`)}${map?B('지도에 핀','pin','secondary tiny',`data-i="${i}"`):''}<label class="row small"><input type="checkbox" data-done="${i}" ${r.done?'checked':''}>활동 완료</label></div></div><div class="moves noprint">${['up','down','remove'].map((a,j)=>`<button class="iconbtn" data-act="${a}" data-i="${i}" aria-label="${['위로','아래로','삭제'][j]}">${['↑','↓','×'][j]}</button>`).join('')}</div></div>`).join('')||'<div class="empty"><span class="emoji">🎡</span>방문하고 싶은 장소를 추가해요.</div>'}${B('＋ 방문 장소 추가','add-place','secondary block mt noprint')}<div class="budget ${b.over?'over':''}"><strong>예상 ${b.sum}분 + 복귀 여유 ${S.config.buffer}분 / ${b.cap}분 안에서</strong><p class="mt8">${b.over?'⚠️ '+(b.sum+S.config.buffer-b.cap)+'분 초과해요. 장소나 시간을 조정해 주세요.':'남은 여유 '+(b.cap-b.sum-S.config.buffer)+'분 · 예상 복귀 '+b.end}</p></div><p class="small muted mt8">복귀 여유 15분은 앱 제안 기본값이며 총괄교사가 바꿀 수 있어요. 실제 도착 시각을 보장하지 않습니다.</p></div><div class="card"><label class="field">이 순서로 정한 이유<textarea id="reason" maxlength="1000">${E(route.reason||'')}</textarea></label><label class="field mt">대체 계획<textarea id="alternative" maxlength="1000" placeholder="대기가 길거나 운영하지 않을 때는 어떻게 할까요?">${E(route.alternative||'')}</textarea></label>${getRec(routeKey()).data.feedback?`<div class="note mt"><strong>선생님 의견</strong><p>${E(getRec(routeKey()).data.feedback)}</p></div>`:''}<div class="row wrap mt noprint">${B('기기 임시저장','local-route','white')}${B('모둠 계획 저장','save-route','secondary')}${B('교사 확인 요청','submit-route','',!S.user.groupId?'disabled':'')}</div>${getLocal('draft:'+S.user.id+':route')?B('임시 계획 불러오기','restore-route','white tiny mt'):''}<p class="small muted mt8">${live?'승인 후 내용을 수정하면 다시 교사 확인을 받아야 합니다.':'시연 모드에서는 실제 서버에 전송하지 않습니다.'}</p></div></div></div>`}
function missionRecords(){return Object.entries(S.records).filter(([k])=>k.startsWith('m:'))}
function recordsView(){const records=missionRecords().filter(([k,r])=>galleryTab==='shared'?r.data.shared&&r.data.status==='approved':teacher()||k.split(':')[1]===S.user.groupId);return`${head('📒 여행 기록 모아보기','함께 남긴 사진과 글을 돌아보고, 여행에서 배운 점을 정리해요.',B('사진 활동지 인쇄','print-records','white noprint'))}<div class="tabs noprint"><button data-gallery="own" class="${galleryTab==='own'?'active':''}">${teacher()?'담당 학생 기록':'우리 모둠 기록'}</button><button data-gallery="shared" class="${galleryTab==='shared'?'active':''}">교사가 승인한 학년 공유</button></div><div class="gallery">${records.map(([k,r])=>`<article class="card"><div>${r.data.photo?`<img src="${E(r.data.photo)}" alt="미션 활동 사진">`:'<div class="no-photo">✏️</div>'}</div><div class="mt8">${P(status[r.data.status],color[r.data.status])}</div><h3 class="mt8">${E(S.config.missions.find(m=>m.id===k.split(':')[2])?.title)}</h3><small class="muted">${E(groupName(k.split(':')[1]))} · ${when(r.at)}</small><p>${E(r.data.answer)}</p>${r.data.question?`<p><strong>더 궁금한 질문</strong><br>${E(r.data.question)}</p>`:''}${r.data.feedback?`<div class="note mt8">${E(r.data.feedback)}</div>`:''}</article>`).join('')}</div>${!records.length?'<div class="card empty"><span class="emoji">📔</span><h3>아직 여행 수첩이 비어 있어요.</h3><p class="mt8">현장 미션을 제출하면 사진과 글이 모여요.</p></div>':''}${!teacher()?`<div class="card mt"><h2>나의 여행 돌아보기</h2><p class="small muted mt8">기억에 남은 일, 계획과 달라진 점, 친구에게 고마웠던 일을 적어 보세요.</p><textarea class="mt" id="reflection" maxlength="4000" rows="6">${E(personal().data.reflection||'')}</textarea><div class="row mt noprint">${B('소감 저장','save-reflection')}${B('내 기록 파일로 보관','export-personal','white')}</div></div>`:''}`}
function scope(){const users=S.users.filter(u=>u.role==='student'&&(filter==='all'||u.classId===filter));const groups=S.groups.filter(g=>filter==='all'||g.classId===filter),ids=new Set(groups.map(g=>g.id));return{users,groups,records:Object.entries(S.records).filter(([k])=>k[0]!=='p'&&ids.has(k.split(':')[1]))}}
function classList(){return[...new Set(S.groups.map(g=>g.classId).concat(S.users.filter(u=>u.role==='student').map(u=>u.classId)))].sort((a,b)=>Number(a)-Number(b))}
function teacherView(){if(!teacher())return'<div class="note warn">교사 권한이 필요합니다.</div>';const t=scope();return`${head('⚙️ 선생님 관리실','반·모둠별 참여 기록을 확인하고 안전한 활동을 도와주세요.',`<div class="row"><select id="class-filter" aria-label="학급 필터"><option value="all">담당 학급 전체</option>${classList().map(c=>`<option value="${c}" ${filter===c?'selected':''}>${c}반</option>`).join('')}</select>${B('새로고침','refresh','white')}</div>`)}<div class="stats mb">${[['등록 학생',t.users.length,'명'],['활동 모둠',t.groups.length,'개'],['확인 대기',t.records.filter(([,r])=>r.data.status==='submitted').length,'건']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}<small>${x[2]}</small></strong></div>`).join('')}</div><div class="tabs">${[['progress','참여 현황'],['roster','학급·모둠'],['review','미션·계획 확인'],['notice','공지'],...(admin()?[['settings','일정·지도·준비물']]:[])].map(a=>`<button data-tab="${a[0]}" class="${tab===a[0]?'active':''}">${a[1]}</button>`).join('')}</div>${tab==='progress'?progressView(t):tab==='roster'?rosterView(t):tab==='review'?reviewView(t):tab==='notice'?noticeView():settingsView()}`}
function progressView(t){return`<div class="note mb">이 표는 학생의 앱 참여 기록입니다. 안전교육의 공식 이수 확인이나 실시간 출석·위치 확인 기능이 아닙니다. ${live?'':'학생·모둠은 시연용 가상 자료입니다.'}</div><div class="card"><div class="between mb"><h3>학생별 사전 준비 현황</h3>${B('현황 CSV 내보내기','csv','secondary tiny')}</div><div class="tablewrap"><table><thead><tr><th>반 / 번호</th><th>별칭</th><th>모둠</th><th>준비물</th><th>안전 약속</th><th>퀴즈</th><th>탐구 질문</th></tr></thead><tbody>${t.users.map(u=>{const p=getRec('p:'+u.id).data;return`<tr><td>${u.classId}반 ${u.number}번</td><td>${E(u.alias)}</td><td>${E(groupName(u.groupId))}</td><td>${S.config.packing.filter(x=>p.checks?.[x.id]==='done'||(x.optional&&p.checks?.[x.id]==='na')).length} / ${S.config.packing.length}</td><td>${Object.values(p.read||{}).filter(Boolean).length} / 5</td><td>${p.score??'—'} / 5</td><td>${E(p.inquiry||'—')}</td></tr>`}).join('')||'<tr><td colspan="7">등록한 학생이 없습니다. 학급·모둠에서 등록하세요.</td></tr>'}</tbody></table></div></div><div class="card between mt"><div><h3>수업 결과물 보관</h3><p class="small muted">담당 학생의 사진·글을 내보냅니다. 파일은 안전하게 보관하세요.</p></div>${B('기록 JSON 내보내기','export-all','white')}</div>`}
function rosterView(t){return`<div class="grid2"><div class="card"><h3>학생 일괄 등록</h3><p class="small muted mt8">한 줄에 <strong>반, 번호, 모둠명, 별칭</strong> 순서로 입력하세요. 실명은 필요하지 않습니다. 같은 반·번호를 중복 등록할 수 없습니다.</p><textarea id="roster" class="mt" rows="6" placeholder="1,1,별빛 탐험대,탐험가1&#10;1,2,별빛 탐험대,탐험가2"></textarea>${B('학생 등록 · 참여코드 발급','roster','mt')}<p class="small muted mt8">발급된 코드는 학생 본인에게만 전달하세요. 실제 명단은 제공되지 않아 자동 등록하지 않았습니다.</p></div><div class="card"><h3>모둠 만들기</h3><div class="formgrid mt"><label class="field">반<input id="group-class" type="number" min="1" max="20" value="${admin()?1:S.user.classId}" ${admin()?'':'readonly'}></label><label class="field">모둠 이름<input id="group-name" maxlength="40"></label><label class="field full">모둠 약속<textarea id="group-promise" maxlength="500"></textarea></label></div>${B('모둠 만들기','new-group','secondary mt')}</div></div><div class="card mt"><h3>학생·역할 관리</h3><div class="tablewrap mt"><table><thead><tr><th>반 / 번호</th><th>별칭</th><th>모둠</th><th>역할</th><th>관리</th></tr></thead><tbody>${t.users.map(u=>`<tr><td>${u.classId}반 ${u.number}번</td><td>${E(u.alias)}</td><td>${E(groupName(u.groupId))}</td><td>${E(u.roleTitle||'미정')}</td><td>${B('수정','edit-user','secondary tiny',`data-id="${u.id}"`)} ${B('코드 재발급','reset-code','white tiny',`data-id="${u.id}"`)}</td></tr>`).join('')}</tbody></table></div></div><div class="grid2 mt">${t.groups.map(g=>`<div class="card"><div class="between"><h3>${g.classId}반 · ${E(g.name)}</h3>${B('수정','edit-group','white tiny',`data-id="${g.id}"`)}</div><p class="small muted mt8">${E(g.promise||'모둠의 약속을 입력하세요.')}</p></div>`).join('')}</div>${admin()?`<div class="card mt"><h3>담임교사 계정 발급</h3><p class="small muted">배정한 학급의 학생·기록만 관리할 수 있습니다.</p><div class="row mt wrap"><input id="teacher-class" type="number" min="1" max="20" placeholder="담당 반" style="max-width:120px"><input id="teacher-alias" maxlength="40" placeholder="교사 표시 이름" style="max-width:250px">${B('교사 참여코드 발급','new-teacher','secondary')}</div></div>`:''}`}
function reviewView(t){return`<div class="card"><h3>동선 계획 · 현장 미션 확인</h3><div class="tablewrap mt"><table><thead><tr><th>모둠</th><th>활동</th><th>상태</th><th>공유</th><th>확인</th></tr></thead><tbody>${t.records.map(([k,r])=>`<tr><td>${E(groupName(k.split(':')[1]))}</td><td>${k[0]==='r'?'롯데월드 동선 계획':E(S.config.missions.find(m=>m.id===k.split(':')[2])?.title)}</td><td>${P(status[r.data.status||'draft'],color[r.data.status||'draft'])}</td><td>${r.data.shared?'학년 공유':r.data.shareConsent?'공유 검토 가능':'모둠만 보기'}</td><td>${B('기록 열기','review','secondary tiny',`data-key="${k}"`)}</td></tr>`).join('')||'<tr><td colspan="5">아직 제출된 기록이 없습니다.</td></tr>'}</tbody></table></div></div>`}
function noticeView(){return`<div class="card"><h3>새 공지 작성</h3><div class="formgrid mt"><label class="field">대상<select id="notice-class">${admin()?'<option value="all">6학년 전체</option>':`<option value="${S.user.classId}">${S.user.classId}반</option>`}${admin()?classList().map(c=>`<option value="${c}">${c}반</option>`).join(''):''}</select></label><label class="field">제목<input id="notice-title" maxlength="80"></label><label class="field full">내용<textarea id="notice-text" maxlength="2000"></textarea></label></div>${B('공지 게시','notice','mt')}<p class="small muted mt8">앱을 열거나 새로고침할 때 확인하는 공지입니다. 푸시 알림·긴급 연락을 대신하지 않습니다.</p></div><div class="stack mt">${S.config.notices.map(n=>`<div class="card"><div class="between"><h3>${E(n.title)}</h3>${P(n.classId==='all'?'학년 공통':n.classId+'반')}</div><p class="mt8" style="white-space:pre-wrap">${E(n.text)}</p><small class="muted">${when(n.at)}</small></div>`).join('')}</div>`}
function settingsView(){if(!admin())return'<div class="note warn">총괄교사 전용 기능입니다.</div>';return`<div class="note warn mb">전체 설정은 모든 학급에 적용됩니다. 실제 집합 장소·시간과 지도를 출발 전에 확인해 주세요. 학생 연락처·건강 정보·숙소 방 번호는 입력하지 않습니다.</div><div class="grid2"><div class="card"><h3>집합 안내 · 계획 시간</h3><div class="formgrid mt"><label class="field">10월 15일 집합 시각<input type="time" id="meet-time" value="${E(S.config.meeting.time)}"></label><label class="field">복귀 여유(분)<input id="buffer" type="number" min="0" max="90" value="${S.config.buffer}"></label><label class="field full">집합 장소<input id="meet-place" maxlength="120" value="${E(S.config.meeting.place)}"></label><label class="field full">안내 문구<input id="meet-note" maxlength="300" value="${E(S.config.meeting.note)}"></label>${['am','pm'].map(p=>`<label class="field">${p==='am'?'오전':'오후'} 시작<input type="time" id="${p}-start" value="${S.config.windows[p][0]}"></label><label class="field">${p==='am'?'오전':'오후'} 종료<input type="time" id="${p}-end" value="${S.config.windows[p][1]}"></label>`).join('')}</div>${B('집합·시간 저장','settings','mt')}</div><div class="card" id="map-settings"><h3>교사가 확인한 지도 등록</h3><p class="small muted mt8">공식 가이드맵에서 확인한 JPG·PNG·WebP 이미지를 층·구역별로 등록하세요. 예시 포스터는 실제 지도로 사용하지 않습니다.</p><a class="btn secondary tiny mt" href="${E(S.config.officialMap)}" target="_blank" rel="noopener noreferrer">공식 가이드맵 확인 ↗</a><label class="field mt">지도 제목<input id="map-name" maxlength="70" placeholder="예: 어드벤처 1층 · 교사 확인본"></label><label class="field mt">지도 이미지<input id="map-file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field mt">출처·확인일 메모<input id="map-note" maxlength="160"></label>${B('지도 등록','upload-map','mt')}<p class="small muted mt8">파일 최대 15MB · 자동 크기 조정 · 최대 6장</p>${S.config.maps.map((m,i)=>`<div class="between mt"><span>${E(m.name)}</span>${B('삭제','remove-map','danger tiny',`data-i="${i}"`)}</div>`).join('')}</div></div><div class="card mt"><h3>상세 일정표 수정</h3><p class="small muted mt8">한 줄에 ‘시각 | 활동 | 안내’를 입력합니다. 변경한 계획 시간과 일정표는 함께 확인하세요.</p><select id="edit-day" class="mt">${S.config.days.map((d,i)=>`<option value="${i}">${i+1}일차 · ${d[0]}</option>`).join('')}</select><textarea id="schedule-edit" class="mt" rows="10">${E(S.config.days[0][4].map(r=>r.join(' | ')).join('\n'))}</textarea>${B('선택한 날짜 저장','save-schedule','mt')}</div><div class="card mt"><h3>준비물 목록 수정</h3><p class="small muted mt8">한 줄에 ‘분류 | 이름 | 설명 | 필수/선택’을 입력하세요. 같은 항목 이름을 유지하면 기존 체크 기록이 이어집니다.</p><textarea id="pack-edit" class="mt" rows="10">${E(S.config.packing.map(x=>`${x.cat} | ${x.title} | ${x.desc} | ${x.optional?'선택':'필수'}`).join('\n'))}</textarea>${B('준비물 목록 저장','save-pack-config','mt')}</div>`}
function loginView(msg=''){$('#app').innerHTML=`<main class="login"><section><div class="brand"><div class="brand-icon">🧭</div><div><strong>우리의 수학여행</strong><small>OUR LITTLE JOURNEY</small></div></div>${P('6학년 · 2박 3일의 배움')}<h1 class="mt">우리의 여행이<br><em>배움이 되는 순간.</em></h1><p class="muted mt">스스로 챙기는 준비물, 친구와 정하는 동선,<br>사진과 한 줄 생각으로 남기는 여행 수첩.</p><div class="login-art">🎒 🗺️ 📷</div><div class="row">${P('사전교육','green')}${P('현장 미션','gold')}${P('모둠 활동')}</div></section><section class="card"><h2>${live?'우리 반 여행에 참여하기':'수학여행 앱을 만나 보세요'}</h2><p class="small muted mt8">${live?'선생님이 나눠 준 나만의 참여코드를 입력하세요.':'화면과 기능을 직접 체험하는 시연 모드입니다.'}</p>${msg?`<div class="note warn mt">${E(msg)}</div>`:''}${live?`<form id="login-form" class="mt"><label class="field">개인 참여코드<input id="login-code" type="password" maxlength="100" autocomplete="current-password" required></label><label class="row mt"><input type="checkbox" id="show-code"><span class="small">참여코드 보이기</span></label><button type="submit" class="btn block mt">여행 수첩 열기 →</button></form><p class="small muted mt">참여코드는 비밀번호와 같아요. 친구와 공유하지 말고, 분실하면 선생님께 재발급을 요청해요.</p>`:`<div class="note warn mt"><strong>이 브라우저에서만 저장되는 시연용입니다.</strong><p class="mt8">여러 휴대폰의 기록은 서로 공유되지 않습니다. 실제 이름·얼굴 사진 등 개인정보를 넣지 마세요.</p></div><div class="stack mt">${B('학생 화면 체험하기 →','demo-student','block')}${B('선생님 관리 화면 체험하기','demo-teacher','secondary block')}</div>`}<p class="small muted mt" style="text-align:center">개인정보를 최소한으로 · 안전한 활동이 먼저</p></section></main>`}
function captureMission(){if(!mission)return;mission.answer=$('#answer')?.value??mission.answer;mission.question=$('#question')?.value??mission.question;mission.shareConsent=$('#consent')?.checked??mission.shareConsent;mission.at=NOW()}
async function openMission(id){const m=S.config.missions.find(m=>m.id===id);if(!m)return;if(teacher()||!S.user.groupId)return modal(m.title,`<p>${E(m.desc)}</p><div class="note mt">${E(m.prompt)}</div><div class="note warn mt">${E(m.tip)}</div><p class="small muted mt">${teacher()?'교사는 관리 화면에서 제출물을 확인하세요. 학생 계정으로 모둠에 배정되면 작성할 수 있어요.':'모둠이 아직 배정되지 않았어요. 선생님께 알려 주세요.'}</p>`);const r=getRec(missionKey(id)),draft=getLocal('draft:'+S.user.id+':'+id);mission=draft&&(!r.at||draft.at>r.at)?draft:{id,rev:r.rev,answer:r.data.answer||'',question:r.data.question||'',photo:r.data.photo||'',shareConsent:!!r.data.shareConsent};modal(m.icon+' '+m.title,`<div class="row">${P(m.place)}${P('모둠 공동 기록','green')}</div><p class="mt">${E(m.desc)}</p><div class="note warn mt">${E(m.tip)}</div><div class="photozone mt"><div id="photo-preview">${mission.photo?`<img src="${E(mission.photo)}" alt="첨부 사진">`:'<span style="font-size:36px">📷</span><p class="small muted">사진을 찍거나 앨범에서 골라요. 글만 제출해도 좋아요.</p>'}</div><label class="field mt8">사진 선택<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp"></label>${B('사진 빼기','remove-photo','white tiny mt8')}</div><label class="field mt">${E(m.prompt)}<textarea id="answer" maxlength="2000" rows="4">${E(mission.answer)}</textarea></label><label class="field mt">더 궁금한 질문 · 선택<input id="question" maxlength="500" value="${E(mission.question)}"></label><label class="row mt"><input id="consent" type="checkbox" ${mission.shareConsent?'checked':''}><span class="small">학교에서 정한 공유 동의 범위 안에서, 교사 확인 후 학년 공유를 요청해요. 동의하지 않아도 제출할 수 있어요.</span></label>${r.data.feedback?`<div class="note mt"><strong>선생님 의견</strong><p>${E(r.data.feedback)}</p></div>`:''}<div class="actions">${B('기기 임시저장','local-mission','white')}${B(live?'모둠 기록 제출':'시연 기록 제출','submit-mission')}</div><p class="small muted mt8">${live?'제출 전까지는 이 기기에만 임시 저장됩니다. 제출 후 같은 모둠과 담당 교사가 볼 수 있어요.':'시연 모드에서는 실제 서버에 전송하지 않습니다.'}</p>`)}
async function imageData(file,max=1200,quality=.78){if(!['image/jpeg','image/png','image/webp'].includes(file.type))error('JPG·PNG·WebP 사진을 선택해 주세요. HEIC는 JPG로 변환해 주세요.');if(file.size>15*1024*1024)error('15MB 이하의 파일을 선택해 주세요.');const url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);const out=c.toDataURL('image/jpeg',quality);if(out.length>3000000)error('변환 후 파일이 큽니다. 더 작은 이미지를 선택해 주세요.');return out}finally{URL.revokeObjectURL(url)}}
function placeModal(i=null){captureRoute();const r=i===null?{name:'',travel:10,wait:20,play:10,note:''}:route[period][i];modal(i===null?'방문 장소 추가':'방문 장소 수정',`<p class="small muted">공식 지도를 참고해 장소 이름을 입력해요. 기본 시간은 설명을 위한 예상값이니 실제 계획에 맞게 바꿔요.</p><label class="field mt">장소 이름<input id="place-name" maxlength="80" value="${E(r.name)}"></label><div class="formgrid mt">${[['travel','이동(분)'],['wait','예상 대기(분)'],['play','체험·휴식(분)']].map(x=>`<label class="field">${x[1]}<input type="number" id="place-${x[0]}" min="${x[0]==='play'?1:0}" max="240" value="${r[x[0]]}"></label>`).join('')}<label class="field full">메모<input id="place-note" maxlength="300" value="${E(r.note||'')}"></label></div><div class="actions">${B('계획에 반영','save-place','',`data-i="${i===null?'new':i}"`)}</div>`)}
function persistPersonal(fn){saveQueue=saveQueue.then(async()=>{const key='p:'+S.user.id,r=personal(),data=cp(r.data);fn(data);try{await change('save',{key,data,rev:r.rev});delLocal('pending:'+S.user.id);if(page==='pack'||page==='home')render();toast(live?'개인 기록이 서버에 저장되었어요.':storageOK?'시연 기록을 이 브라우저에 저장했어요.':'브라우저 저장이 제한되어 현재 창에서만 유지돼요.')}catch(e){setLocal('pending:'+S.user.id,{key,data,rev:r.rev});toast(e.status===409?e.message:'전송에 실패하여 기기에 임시 보관했어요. 계정 메뉴에서 다시 전송하세요.',true)}});return saveQueue}
function download(name,obj,mime='application/json'){const url=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function printDoc(title,content){const html=`<!doctype html><html lang="ko"><meta charset="utf-8"><title>${E(title)}</title><style>body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#203b50;line-height:1.7;max-width:850px;margin:25px auto;padding:20px}h1{border-bottom:3px solid #2977d5;padding-bottom:12px}article{border:1px solid #cad9e4;border-radius:12px;padding:20px;margin:20px 0;break-inside:avoid}img{max-width:100%;max-height:350px;object-fit:contain}p{white-space:pre-wrap;word-break:break-word}small{color:#6e8598}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd9e1;text-align:left;padding:8px;font-size:13px}button{padding:12px 20px;border:0;border-radius:10px;background:#2476df;color:white}@media print{button{display:none}body{padding:0;margin:0}}</style><button onclick="window.print()">인쇄 / PDF로 저장</button><h1>${E(title)}</h1>${content}<p><small>2026 사회문화체험 수학여행 · ${when(NOW())}</small></p></html>`,w=window.open('','_blank');if(!w){download(title+'.html',html,'text/html;charset=utf-8');toast('새 창이 차단되어 인쇄용 파일로 저장했어요.');return}w.document.open();w.document.write(html);w.document.close()}
function routePrint(r=route,g=groupName(S.user.groupId)){captureRoute();printDoc('우리 모둠 롯데월드 계획표',`<p>${E(g)}</p>${['am','pm'].map(p=>`<h2>${p==='am'?'오전':'오후'} ${S.config.windows[p].join('~')}</h2><table><tr><th>순서</th><th>장소</th><th>이동</th><th>대기</th><th>체험</th><th>메모</th></tr>${(r[p]||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.name)}</td><td>${x.travel}분</td><td>${x.wait}분</td><td>${x.play}분</td><td>${E(x.note)}</td></tr>`).join('')}</table><p><small>예상 ${budget(r,p).sum}분 + 복귀 여유 ${S.config.buffer}분 / 실시간 안내가 아닙니다.</small></p>`).join('')}<h2>선택한 이유</h2><p>${E(r.reason||'')}</p><h2>대체 계획</h2><p>${E(r.alternative||'')}</p>`)}
function recordPrint(){const items=missionRecords().filter(([k])=>teacher()?filter==='all'||S.groups.find(g=>g.id===k.split(':')[1])?.classId===filter:k.split(':')[1]===S.user.groupId);printDoc('수학여행 사진 활동지',items.map(([k,r])=>`<article><small>${E(groupName(k.split(':')[1]))}</small><h2>${E(S.config.missions.find(m=>m.id===k.split(':')[2])?.title)}</h2>${r.data.photo?`<img src="${E(r.data.photo)}" alt="활동 사진">`:''}<p>${E(r.data.answer)}</p>${r.data.question?`<p><strong>더 궁금한 질문</strong><br>${E(r.data.question)}</p>`:''}${r.data.feedback?`<p><strong>선생님 의견</strong><br>${E(r.data.feedback)}</p>`:''}</article>`).join('')+(!teacher()?`<h2>나의 여행 소감</h2><p>${E($('#reflection')?.value||personal().data.reflection||'')}</p>`:''))}
function showCodes(codes){issued=codes;modal('참여코드 발급 완료',`<div class="note warn">참여코드는 비밀번호입니다. 지금만 원문을 확인할 수 있어요. 학생·담임교사에게 개별 전달하고 파일은 안전하게 보관하세요.</div>${codes.map(u=>`<div class="mt"><strong>${E(userLabel(u))} · ${E(u.alias)}</strong><div class="code mt8">${E(u.code)}</div></div>`).join('')}<div class="actions">${B('개별 배부용 인쇄','print-codes','white')}${B('코드 목록 저장','export-codes')}</div>`)}

case 'more':return modal('전체 메뉴',`<div class="quickgrid">${M.concat(teacher()?[['teacher','⚙️','교사 관리']]:[]).map(m=>`<button class="quick" data-nav="${m[0]}"><span class="emoji">${m[1]}</span><strong>${m[2]}</strong></button>`).join('')}</div>`);

rosterView=function(t){return`<div class="note mb">가상 모둠의 역할과 약속을 수정해 볼 수 있습니다. 실제 학생 이름·연락처는 입력하지 마세요.</div><div class="stack">${t.groups.map(g=>`<section class="card"><div class="between wrap"><div>${P(g.classId+'반 · 가상 모둠')}<h3 class="mt8">${E(g.name)}</h3></div>${B('약속 수정','edit-group','secondary tiny',`data-id="${g.id}"`)}</div><p class="small muted mt">${E(g.promise)}</p>${t.users.filter(u=>u.groupId===g.id).map(u=>`<div class="member"><span class="emoji">🌱</span><div class="grow"><strong>${E(u.alias)}</strong><p class="small muted">${E(u.roleTitle||'역할 미정')}</p></div>${B('역할','edit-user','white tiny',`data-id="${u.id}"`)}</div>`).join('')}</section>`).join('')}</div>`};
reviewView=function(t){return`<div class="stack">${t.records.map(([k,r])=>{const m=S.config.missions.find(m=>m.id===k.split(':')[2]);return`<article class="card review-entry"><div class="entry-title"><span class="emoji">${k[0]==='r'?'🗺️':m?.icon||'📷'}</span><div><h3>${k[0]==='r'?'롯데월드 동선 계획':E(m?.title||'미션')}</h3><p class="small muted mt8">${E(groupName(k.split(':')[1]))}</p></div></div><div class="between">${P(status[r.data.status||'draft'],color[r.data.status||'draft'])}${B('기록 확인','review','secondary',`data-key="${k}"`)}</div></article>`}).join('')||`<div class="no-records"><span class="emoji">📮</span><h3>확인할 기록이 아직 없어요.</h3><p class="mt8">학생 화면에서 미션을 작성해 제출한 뒤<br>이 화면에서 확인해 보세요.</p>${B('학생 미션 체험','student-missions','secondary mt')}</div>`}</div>`};
teacherView=function(){if(!teacher())return'';const t=scope();return`${head('선생님 관리실','학급별 현황과 모둠의 기록을 휴대폰에서 확인해요.')}<div class="stats mb">${[['가상 학생',t.users.length,'명'],['가상 모둠',t.groups.length,'개'],['확인 대기',t.records.filter(([,r])=>r.data.status==='submitted').length,'건']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}<small> ${x[2]}</small></strong></div>`).join('')}</div><div class="between teacher-filters mb"><span class="small muted">시연용 학급 선택</span><select id="class-filter" aria-label="학급 선택"><option value="all">전체 학급</option>${classList().map(c=>`<option value="${c}" ${filter===c?'selected':''}>${c}반</option>`).join('')}</select></div><div class="tabs">${[['progress','참여 현황'],['review','기록 확인'],['roster','모둠·역할'],['notice','공지'],['settings','일정·지도 설정']].map(a=>`<button data-tab="${a[0]}" class="${tab===a[0]?'active':''}">${a[1]}</button>`).join('')}</div>${tab==='progress'?progressView(t):tab==='roster'?rosterView(t):tab==='review'?reviewView(t):tab==='notice'?noticeView():settingsView()}`};
settingsView=function(){return ORIGINAL_SETTINGS().replace('전체 설정은 모든 학급에 적용됩니다. 실제 집합 장소·시간과 지도를 출발 전에 확인해 주세요. 학생 연락처·건강 정보·숙소 방 번호는 입력하지 않습니다.','여기서 바꾸는 설정은 이 브라우저의 시연 화면에만 적용됩니다. 다른 선생님의 화면은 바뀌지 않습니다. 학생 연락처·건강 정보·숙소 방 번호는 입력하지 마세요.')};
routeView=function(){return`${teacher()?`<div class="note mb">동선 작성은 학생 화면에서 체험해 주세요. ${B('학생 동선 작성 체험','student-route','secondary mt8')}</div>`:''}${ORIGINAL_ROUTE()}`};
openMission=async function(id){await ORIGINAL_OPEN_MISSION(id);if(!$('#photo-file'))return;const old=$('#photo-file').closest('label');old.outerHTML=`<div class="photo-actions"><label class="btn secondary">📷 사진 찍기<input id="camera-file" type="file" accept="image/*" capture="environment" aria-label="카메라로 사진 찍기"></label><label class="btn white">🖼️ 앨범에서 선택<input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="앨범 사진 선택"></label></div>`;const last=$('.dialog>p:last-child');if(last)last.textContent='사진과 글은 이 기기에만 저장됩니다. 실제 학생의 얼굴 사진은 사용하지 마세요.'};
function notesView(){const notes=getLocal('review-notes')||[];return`${head('선생님 검토 메모','살펴본 내용을 적고, 복사하거나 공유해서 의견을 나눠요.')}<div class="note mb"><strong>메모가 자동으로 모이는 게시판은 아닙니다.</strong><br>이 기기에 저장한 의견을 ‘의견 공유’로 직접 전달해 주세요.</div><section class="card review-note"><label class="field">검토한 메뉴<select id="review-category">${['전체','홈','준비물 체크','사전교육','일정표','현장 미션','우리 모둠','롯데월드 동선','여행 기록','교사 관리'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field mt">검토 의견<textarea id="review-message" maxlength="3000" placeholder="좋았던 점이나 수정이 필요한 점을 적어 주세요. 실제 학생 이름·연락처는 적지 마세요."></textarea></label><div class="actions mt">${B('메모 저장','save-review-note')}${B('의견 공유','share-review-note','secondary')}${B('의견 복사','copy-review-note','white')}</div></section><div class="section-title"><h2>이 기기의 검토 기록</h2><small>${notes.length}건</small></div><div class="notes-list">${notes.slice().reverse().map(n=>`<article class="card"><div class="between">${P(n.category,'green')}${B('삭제','delete-review-note','white tiny',`data-id="${E(n.id)}"`)}</div><p class="mt">${E(n.message)}</p><small class="muted" style="font-size:11px">${E(when(n.at))}</small>${B('이 의견 공유','share-saved-note','secondary block mt',`data-id="${E(n.id)}"`)}</article>`).join('')||'<div class="no-records"><span class="emoji">✍️</span><p>첫 검토 의견을 남겨 보세요.</p></div>'}</div>`}
function saveNotesDraft(){if($('#review-message'))setLocal('notes-draft',{category:$('#review-category').value,message:$('#review-message').value})}
function currentNote(){return{category:$('#review-category')?.value||'전체',message:$('#review-message')?.value.trim()||''}}
function reviewText(n){return`[6학년 수학여행 앱 검토 의견]\n검토 메뉴: ${n.category}\n\n${n.message}\n\n※ 실제 학생 개인정보 없이 기능을 검토한 의견입니다.`}
function publicReviewURL(){return /^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1','0.0.0.0'].includes(location.hostname)?location.origin+location.pathname+location.hash:''}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('복사했어요. 대화방에 붙여 넣어 주세요.');return}}catch{}modal('복사할 내용',`<p class="small muted">아래 내용을 길게 눌러 선택하고 복사해 주세요.</p><textarea id="manual-copy" readonly class="mt" rows="7">${E(text)}</textarea>`);$('#manual-copy').focus();$('#manual-copy').select()}
async function shareText(title,text,url=''){if(navigator.share){try{await navigator.share({title,text,...(url?{url}:{})});return}catch(e){if(e.name==='AbortError')return}}return copyText(text+(url?'\n'+url:''))}
function reviewInfo(){modal('모바일 검토용 앱 안내',`<div class="stack"><div class="note success"><strong>접속코드와 회원가입이 없습니다.</strong><p class="mt8">주소를 열면 바로 학생 화면을 볼 수 있고, 위쪽 버튼으로 교사 화면을 체험할 수 있습니다.</p></div><div><h3>같은 화면을 보고, 각자 체험해요.</h3><p class="small muted mt8">기록과 설정은 현재 브라우저에만 저장됩니다. 다른 선생님의 휴대폰에는 자동으로 반영되지 않아요. 의견은 ‘검토 메모’에서 공유할 수 있습니다.</p></div><div><h3>링크를 아는 사람은 누구나 볼 수 있어요.</h3><p class="small muted mt8">교사 여부를 확인하는 인증은 없습니다. 실제 학생 이름·연락처·얼굴 사진·건강 정보는 넣지 마세요.</p></div><div><h3>지도와 현장 정보</h3><p class="small muted mt8">공식 가이드맵을 새 창으로 확인하거나, 교사 화면에서 확인한 지도 이미지를 등록해 확대·번호 표시를 시험할 수 있습니다. 실시간 위치·대기시간·최단 경로는 제공하지 않습니다.</p></div>${B('다른 가상 학생으로 체험','switch','secondary')}${B('검토 메모 열기','open-notes','white')}${B('이 기기의 시연 기록 초기화','mobile-reset','danger')}</div>`)}
act=async function(a,el){switch(a){
 case 'mobile-student':return setDemoProfile('s1','home');
 case 'mobile-teacher':return setDemoProfile('admin','teacher');
 case 'student-route':return setDemoProfile('s1','route');
 case 'student-missions':return setDemoProfile('s1','missions');
 case 'go-teacher':return setDemoProfile('admin','teacher');
 case 'open-notes':close();return nav('notes');
 case 'mobile-info':case 'help':case 'account':return reviewInfo();
 case 'more':modal('여행 수첩 전체 메뉴',`<div class="menu-items">${M.concat([['teacher','⚙️','교사 관리']]).map(m=>`<button data-nav="${m[0]}"><span>${m[1]}</span>${m[2]}</button>`).join('')}</div><div class="note mt">접속코드 없는 검토용입니다. 모든 입력은 이 브라우저에만 남아요.</div>`);$('#modal').className='menu-sheet';return;
 case 'mobile-share':{const url=publicReviewURL();if(!url)return modal('인터넷 주소가 아직 없어요',`<p>현재는 내려받은 파일 또는 점검 화면입니다. 실제 링크를 공유하려면 배포가 필요해요.</p><div class="note mt">배포 후 이 버튼을 누르면 휴대폰의 공유 메뉴를 열거나 링크를 복사합니다. HTML 파일 경로는 인터넷 주소로 공유하지 않습니다.</div>`);return shareText('6학년 수학여행 앱 · 모바일 검토','접속코드 없이 화면과 기능을 검토해 주세요. 기록은 각자의 기기에만 저장됩니다.',url)}
 case 'choose-demo':return setDemoProfile(el.dataset.id,'home');
 case 'logout':return setDemoProfile('s1','home');
 case 'pack-filter':packFilter=el.dataset.filter;return render();
 case 'reset-packing':if(confirm('현재 가상 학생의 준비물 체크만 초기화할까요?'))await persistPersonal(p=>p.checks={});return;
 case 'copy-packing':{const p=personal().data;return copyText('[수학여행 준비물 체크 · 검토용]\n'+S.config.packing.map(x=>`${p.checks?.[x.id]==='done'?'☑':p.checks?.[x.id]==='na'?'—':'☐'} ${x.title}${p.checks?.[x.id]==='na'?' (해당 없음)':''}`).join('\n'))}
 case 'save-review-note':{const n=currentNote();if(n.message.length<2)error('검토 의견을 두 글자 이상 적어 주세요.');const notes=getLocal('review-notes')||[];notes.push({id:ID(),at:NOW(),...n});setLocal('review-notes',notes);delLocal('notes-draft');render();return toast(storageOK?'검토 의견을 이 기기에 저장했어요.':'저장이 제한되어 현재 창에서만 유지돼요.')}
 case 'copy-review-note':case 'share-review-note':{const n=currentNote();if(!n.message)error('공유할 의견을 먼저 적어 주세요.');saveNotesDraft();return a==='copy-review-note'?copyText(reviewText(n)):shareText('수학여행 앱 검토 의견',reviewText(n))}
 case 'delete-review-note':if(confirm('이 검토 메모를 삭제할까요?')){setLocal('review-notes',(getLocal('review-notes')||[]).filter(n=>n.id!==el.dataset.id));render()}return;
 case 'share-saved-note':{const n=(getLocal('review-notes')||[]).find(n=>n.id===el.dataset.id);if(n)return shareText('수학여행 앱 검토 의견',reviewText(n));return}
 case 'mobile-reset':if(confirm('이 브라우저의 가상 학생 기록·사진·지도·메모·설정을 모두 지울까요?')){close();try{Object.keys(localStorage).filter(k=>k.startsWith('trip6-mobile-review:')).forEach(k=>localStorage.removeItem(k))}catch{}memory.clear();demo=freshDemo();demoId='s1';S=demoState();route=null;packFilter='all';setLocal('demo',demo);nav('home');toast('시연 기록을 초기화했어요.')}return;
 case 'switch':return modal('가상 학생·교사 바꾸기',`<p class="small muted">로그인 없이 화면만 바꿔 체험합니다. 실제 계정이 아니에요.</p><div class="stack mt">${demo.users.map(u=>B(`${E(u.alias)} · ${E(userLabel(u))}`,'choose-demo','secondary',`data-id="${u.id}"`)).join('')}</div>`);
 }
 return ORIGINAL_ACT(a,el);
};
document.addEventListener('change',async e=>{if(e.target.id==='camera-file'&&e.target.files[0]){try{captureMission();const data=await imageData(e.target.files[0]);if(!mission)return;mission.photo=data;$('#photo-preview').innerHTML=`<img src="${E(data)}" alt="촬영한 사진">`;setLocal('draft:'+S.user.id+':'+mission.id,mission);toast('촬영한 사진을 첨부했어요.')}catch(err){toast(err.message,true)}}if(e.target.id==='review-category')saveNotesDraft()});
document.addEventListener('input',e=>{if(e.target.id==='review-message')saveNotesDraft()});
window.addEventListener('pagehide',()=>{if(S&&route){captureRoute();setLocal('draft:'+S.user.id+':route',{data:route,rev:routeRev})}if(S&&mission){captureMission();setLocal('draft:'+S.user.id+':'+mission.id,mission)}saveNotesDraft()});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==page){if($('#modal').innerHTML)close();nav(p)}});
init=function(){live=false;demo=getLocal('demo')||freshDemo();if(!Array.isArray(demo.users)||!demo.users.some(u=>u.id==='s1')||!demo.users.some(u=>u.id==='admin'))demo=freshDemo();const hash=location.hash.slice(1);demoId=hash==='teacher'?'admin':getLocal('profile')||'s1';if(!demo.users.some(u=>u.id===demoId))demoId='s1';S=demoState();page=[...M.map(m=>m[0]),'teacher'].includes(hash)?hash:'home';render()};
init();
</script></body></html>
